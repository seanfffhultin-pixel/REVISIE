<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in — REVISIÉ</title><link rel="stylesheet" href="styles.css"></head><body><div class="auth-page"><div class="auth-mark"><span>R</span><strong>REVISIÉ</strong></div><main class="auth-card"><p class="eyebrow">YOUR PRIVATE REVISION SPACE</p><h1>Sign in.</h1><p class="hero-copy">Create or return to your personal revision workspace. Your subjects, notes, flashcards, files, and progress will sync securely across devices.</p><form id="accountForm" class="settings-form"><label>Your name <small>(new accounts)</small><input id="accountName" placeholder="e.g. Alex Smith"></label><label>Email address<input id="accountEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="accountPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="primary-button" type="submit">Sign in or create account <i data-lucide="arrow-right"></i></button></form><p class="auth-note">New email addresses create an account. Existing ones sign in with the same password.</p></main></div><div class="toast" id="toast" role="status"></div><script src="https://unpkg.com/lucide@latest"></script><script src="site.js"></script></body></html>
