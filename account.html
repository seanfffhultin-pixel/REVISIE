<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Account — REVISIÉ</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand.css"></head><body><div class="auth-page"><div class="auth-mark auth-logo"><img src="assets/revisie-logo.png?v=2" alt="REVISIÉ" width="148" height="63"></div><main class="auth-card"><p class="eyebrow">YOUR PRIVATE REVISION SPACE</p><div class="auth-tabs" role="tablist" aria-label="Account options"><button type="button" role="tab" aria-selected="true" data-auth-mode="login">Log in</button><button type="button" role="tab" aria-selected="false" data-auth-mode="signup">Sign up</button></div><section data-auth-panel="login"><h1>Welcome back.</h1><p class="hero-copy">Log in to open your saved revision workspace.</p><form id="loginForm" class="settings-form"><label>Email address<input id="loginEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="primary-button" type="submit">Log in <i data-lucide="arrow-right"></i></button></form></section><section data-auth-panel="signup" hidden><h1>Create account.</h1><p class="hero-copy">We’ll send a confirmation email, then bring you back here to log in.</p><form id="signupForm" class="settings-form"><label>Your name<input id="signupName" required autocomplete="name" placeholder="e.g. Alex Smith"></label><label>Email address<input id="signupEmail" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="signupPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></label><label>Confirm password<input id="signupPasswordConfirm" type="password" minlength="6" required autocomplete="new-password" placeholder="Repeat your password"></label><button class="primary-button" type="submit">Create account <i data-lucide="mail"></i></button></form></section><p class="auth-note">Use the confirmation link from your email before logging in. Check spam if it does not arrive within a few minutes.</p></main></div><div class="toast" id="toast" role="status"></div><script src="https://unpkg.com/lucide@latest"></script><script src="site.js"></script></body></html>
