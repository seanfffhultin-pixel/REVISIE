<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared item — REVISIÉ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <div class="auth-page">
    <a class="auth-mark auth-logo" href="index.html"><img src="assets/revisie-logo.png?v=2" alt="REVISIÉ" width="148" height="63"></a>
    <main class="auth-card shared-card">
      <p class="eyebrow">SHARED WITH YOU</p>
      <h1 id="sharedTitle">Loading…</h1>
      <p id="sharedDescription" class="hero-copy">Opening this shared study item.</p>
      <div id="sharedPreview"></div>
      <button id="saveSharedItem" class="primary-button" type="button" hidden>Save to my workspace</button>
      <p id="sharedStatus" class="auth-note"></p>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="site.js"></script>
</body>
</html>
